# Config de producción — NO reemplaza frontend/nginx.conf (usado por
# docker-compose.yml en dev, sin TLS). Este archivo lo monta
# docker-compose.prod.yml sobre /etc/nginx/conf.d/default.conf.
#
# Certificado provisto manualmente por el equipo (no hay automatización de
# Let's Encrypt/certbot): colocar en ./certs, en el host, estos dos archivos
# exactos antes de levantar el stack de prod:
#   ./certs/fullchain.pem  (cert + cadena intermedia)
#   ./certs/privkey.pem    (clave privada, permisos 600)
# Ver docs/RUNBOOK.md § reemplazo de certificado.

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # Los exports Excel/PDF (F7.1) pueden tardar; 25MB da margen sobre el
    # límite de 20MB de application.yml (server.servlet.multipart) para que
    # nginx no corte con 413 antes de que la request llegue al backend.
    client_max_body_size 25m;

    # Headers de seguridad básicos.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP en modo Report-Only primero: verificar en la consola del browser que
    # nada se bloquea (shadcn/Radix a veces necesitan estilos inline) antes de
    # pasar a enforcing (Content-Security-Policy). Ver docs/RUNBOOK.md § deploy.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none';" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Assets hasheados de Vite: cacheables de forma agresiva.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy al backend. Nunca se proxya /actuator/** — junto con que el
    # backend no publica puerto en docker-compose.prod.yml, esto mantiene
    # Actuator inalcanzable desde internet (ver application-prod.yml).
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # SPA: cualquier ruta de React Router que no matchee un archivo cae a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
