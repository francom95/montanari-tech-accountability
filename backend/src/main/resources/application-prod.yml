spring:
  config:
    activate:
      on-profile: prod
  # Sin valores por defecto a propósito: en prod, si falta una variable de
  # entorno el arranque debe fallar en vez de usar un secreto de relleno.
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: false

app:
  cors:
    # Opcional en prod: nginx.prod.conf sirve el frontend y proxya /api/ bajo
    # el mismo dominio, así que el browser nunca hace una llamada cross-origin
    # en la topología estándar y esto no hace falta. Completar solo si el API
    # se va a llamar desde otro origen (ej. un subdominio separado, una app
    # mobile). Lista separada por comas.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

logging:
  level:
    root: INFO
    com.montanaritech: INFO

management:
  endpoint:
    health:
      # Defensa en profundidad: el control real es de red (backend sin
      # puerto publicado en docker-compose.prod.yml + nginx.prod.conf nunca
      # proxya /actuator/**), pero esto evita depender del plumbing de
      # autorización de Spring para el rol de actuator (hoy no cableado).
      show-details: never
