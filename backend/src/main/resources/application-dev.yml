spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:montanari_contable}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:montanari}
    password: ${DB_PASSWORD:montanari}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true

# F11.2 A4: sin default acá — el fallback hardcodeado de baja entropía firmaba
# JWT válidos en cualquier despliegue que arrancara con perfil dev y sin JWT_SECRET
# seteado. application.yml (base, todos los perfiles) ya exige JWT_SECRET sin
# default; dev ahora hereda esa misma exigencia en vez de tener la suya propia.

logging:
  level:
    com.montanaritech: DEBUG
    org.hibernate.SQL: DEBUG
